<!DOCTYPE html> 
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Ciclos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <h3> Ejercicios ciclos repetitivos </h3>

    <div class="container">

        
        <div class="input-group">
            <label for="operacion">Operación:</label>
            <select id="operacion">
                <option value="">-- Selecciona --</option>
                <option value="eje11">11. Suma de elementos de vector</option>
                <option value="eje12">12. Encontrar max en vector</option>
                <option value="eje13">13. Buscar elemento en vector</option>
                <option value="eje14">14. Invertir vector</option>
                <option value="eje15">15. Contar pares en vector</option>
            </select>
        </div>

        
        <div id="inputs-dinamicos"></div>

        
        <button id="ejecutar">Ejecutar</button>

        
        <div class="result" id="resultados">Resultados...</div>

        <div id="cajas"></div>

    </div>

    <hr>

  
    <h2> Tests del sistema </h2>

    <button id="run-tests">Ejecutar pruebas</button>
    <div id="test-results"></div>

    
    <script type="module" src="js/principal.js"></script>
    <script type="module" src="js/tests-ui.js"></script>

</body>

</html>
